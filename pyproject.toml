[project]
name = "ai-standards-evals"
version = "0.1.0.dev0"
description = "Executable behavioral verification for the ai-standards repository."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1.0",
  "inspect-ai>=0.3,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evals*", "scorers*", "agents*", "scripts*"]

[dependency-groups]
dev = [
  "mypy>=1.18.0,<2.0.0",
  "pytest>=8.4.0,<9.0.0",
  "ruff>=0.13.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["evals", "scorers", "agents", "scripts"]
exclude = ["reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
